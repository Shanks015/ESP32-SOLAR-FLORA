name: iOS IPA Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign || echo "First build generated configs but might have failed sandbox check."
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..
          flutter build ios --release --no-codesign > build_log.txt 2>&1 || true

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build_log.txt

      - name: Package into IPA
        run: |
          mkdir -p Payload
          find build/ios -name "*.app" -type d -exec cp -r {} Payload/ \;
          ls -la Payload/
          zip -qq -r -9 Solak_iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solak_iOS_App
          path: Solak_iOS.ipa
