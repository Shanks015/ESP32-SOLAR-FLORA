name: solak
description: A smart, solar-powered plant watering app
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  google_sign_in: ^6.0.0
  image_picker: ^0.8.0+0
  google_fonts: ^8.1.0
  flutter_dotenv: ^6.0.1


  http: ^1.2.0
  url_launcher: ^6.2.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  app_settings: ^8.0.3
  shorebird_code_push: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/brand/brand_logo.png
    - shorebird.yaml
